name: Deploy dbconfig to FTP

on:
  workflow_dispatch:

jobs:
  upload-dbconfig:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_TOKEN_KEY: ${{ secrets.DB_TOKEN_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          for v in DB_HOST DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!v}" ]; then
              echo "Missing Actions secret: $v"
              exit 1
            fi
          done

      - name: Build dbconfig.php from template
        env:
          DBCONFIG_B64: ${{ secrets.DBCONFIG_B64 }}
        run: |
          php .github/scripts/build-dbconfig.php
          if [ -n "$DBCONFIG_B64" ]; then
            printf '%s' "$DBCONFIG_B64" | base64 -d > dbconfig.php
            echo "using exact dbconfig secret"
          fi
          php -l dbconfig.php
          php -r 'define("_GNUBOARD_", true); include "dbconfig.php"; if (!defined("G5_MYSQL_HOST") || !defined("G5_MYSQL_USER") || !defined("G5_MYSQL_PASSWORD") || !defined("G5_MYSQL_DB")) { fwrite(STDERR, "dbconfig constants missing\n"); exit(1);} echo "constants_ok shop=".(defined("G5_USE_SHOP") && G5_USE_SHOP ? "on" : "off")."\n";'

      - name: Install lftp and upload
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_SERVER" -e "
            set ftp:charset utf-8;
            put dbconfig.php -o /public_html/data/dbconfig.php;
            chmod 644 /public_html/data/dbconfig.php;
            bye"
