name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./public_html/
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/._*
            data/dbconfig.php
            data/cache/**
            data/session/**
            data/log/**
            data/tmp/**
            data/file/**
            data/editor/**
            data/backup/**
            data/member_image/**
            adminpw.php
            *.log
