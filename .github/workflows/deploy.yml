name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_slate:
        description: "true면 FTP public_html을 Git 기준으로 정리(서버만 있는 파일 삭제). dbconfig 등 exclude 유지"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./public_html/
          server-dir: /public_html/
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate == 'true' }}
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/._*
            data/dbconfig.php
            data/cache/**
            data/session/**
            data/log/**
            data/tmp/**
            data/file/**
            data/editor/**
            data/backup/**
            data/member_image/**
            adminpw.php
            db_test.php
            db_alive.php
            *.log
